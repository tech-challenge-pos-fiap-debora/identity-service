name: CD — identity-service (Kind)

# Lab local no runner: sobe Kind, aplica manifests do identity, smoke em
# /health e destrói o cluster. Deploy real na AWS fica no publish-ecr.yml.
on:
  workflow_dispatch:

concurrency:
  group: cd-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: identity-service
  CLUSTER_NAME: tech-challenge
  NAMESPACE: tech-challenge-namespace
  API_IMAGE: identity-service:latest
  MIGRATIONS_IMAGE: identity-service:migrations
  NEW_RELIC_ENABLED: 'false'
  INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/identity

jobs:
  test:
    name: Testes + build (identity)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn test:integration
      - run: yarn build

  build-images:
    name: Build imagens Docker (identity)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem de produção (identity API)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: ${{ env.API_IMAGE }}
          load: true
          outputs: type=docker,dest=/tmp/identity-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagem de migrations (identity)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          tags: ${{ env.MIGRATIONS_IMAGE }}
          load: true
          outputs: type=docker,dest=/tmp/identity-migrations-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guardar imagens identity como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: identity-docker-images
          path: |
            /tmp/identity-api-image.tar
            /tmp/identity-migrations-image.tar
          retention-days: 1

  deploy:
    name: Kind + deploy K8s (identity)
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v5

      - name: Baixar imagens Docker do identity
        uses: actions/download-artifact@v4
        with:
          name: identity-docker-images
          path: /tmp

      - name: Carregar imagens no Docker local do runner
        run: |
          docker load --input /tmp/identity-api-image.tar
          docker load --input /tmp/identity-migrations-image.tar
          docker images | grep identity-service

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Instalar Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform apply (cria cluster Kind + namespace + metrics-server)
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Configurar KUBECONFIG
        run: |
          kind export kubeconfig --name "$CLUSTER_NAME"
          kubectl cluster-info
          kubectl get nodes

      - name: Carregar imagens no cluster Kind
        run: |
          kind load docker-image "$API_IMAGE" --name "$CLUSTER_NAME"
          kind load docker-image "$MIGRATIONS_IMAGE" --name "$CLUSTER_NAME"

      - name: Aplicar config (namespace, ConfigMap, Secret)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Subir PostgreSQL (identity-postgres)
        run: |
          kubectl apply -f k8s/identity-postgres-pvc.yaml
          kubectl apply -f k8s/identity-postgres-service.yaml
          kubectl apply -f k8s/identity-postgres-deployment.yaml
          kubectl rollout status deployment/identity-postgres -n "$NAMESPACE" --timeout=180s

      - name: Rodar migrations do identity (Job)
        run: |
          kubectl delete job identity-migration -n "$NAMESPACE" --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/identity-migration -n "$NAMESPACE" --timeout=180s \
            || (kubectl logs job/identity-migration -n "$NAMESPACE" --all-containers; exit 1)

      - name: Deploy do identity + HPA
        run: |
          kubectl apply -f k8s/identity-deployment.yaml
          kubectl apply -f k8s/identity-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/identity -n "$NAMESPACE" --timeout=180s

      - name: Smoke test (/health + carimbo service)
        run: |
          kubectl port-forward svc/identity 8080:80 -n "$NAMESPACE" &
          PF_PID=$!
          sleep 5
          echo "== /health/live =="
          curl -fsS http://localhost:8080/health/live | tee /tmp/live.json
          echo
          echo "== /health/ready =="
          curl -fsS http://localhost:8080/health/ready | tee /tmp/ready.json
          echo
          kill $PF_PID || true
          grep -q '"status":"ok"' /tmp/live.json
          grep -q '"status":"ok"' /tmp/ready.json
          grep -q '"service":"identity-service"' /tmp/live.json
          grep -q '"service":"identity-service"' /tmp/ready.json

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" || true
          kubectl describe pods -n "$NAMESPACE" || true
          kubectl logs -l app.kubernetes.io/name=identity -n "$NAMESPACE" --all-containers --tail=100 || true

      - name: Teardown (destrói o cluster)
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve -input=false || true
